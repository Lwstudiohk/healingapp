        ];

        let cardsData = []; // 存放預處理過路徑的資料
        let currentCategory = 'all';

        // 核心修正：使用標準的相對路徑解析
        function resolveImageUrl(filename) {
            // 獲取 index.html 的所在路徑，並指向平排的 111 資料夾
            const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
            return ${baseUrl}/111/${filename};
        }

        // 初始化：預處理所有圖片路徑
        function initData() {
            cardsData = rawCardsData.map(card => ({
                ...card,
                // 先嘗試使用相對路徑，如果失敗再考慮 Blob
                imgUrl: resolveImageUrl(card.filename)
            }));
        }

        // 重新綁定事件，防止卡死
        function bindEvents() {
            document.getElementById('cardElement').addEventListener('click', drawCard);
            document.getElementById('drawBtn').addEventListener('click', drawCard);
            
            document.getElementById('categoryContainer').addEventListener('click', function(e) {
                if (e.target.classList.contains('cat-btn')) {
                    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentCategory = e.target.getAttribute('data-cat');
                    drawCard();
                }
            });
        }

        function drawCard() {
            let filteredCards = cardsData;
            if (currentCategory !== 'all') {
                filteredCards = cardsData.filter(c => c.category === currentCategory);
            }
            
            if (filteredCards.length === 0) return;

            const randomIndex = Math.floor(Math.random() * filteredCards.length);
            const selectedCard = filteredCards[randomIndex];

            const cardEl = document.getElementById('cardElement');
            const bgImgEl = document.getElementById('cardBgImg');
            const quoteEl = document.getElementById('cardText');
            const tagEl = document.getElementById('cardCategory');

            // 切換動效
            cardEl.style.opacity = '0.3';
            
            // 預載入圖片，成功後再顯示，防止黑色閃爍
            const imgLoader = new Image();
            imgLoader.onload = function() {
                tagEl.innerText = selectedCard.tag;
                quoteEl.innerText = selectedCard.text;
                bgImgEl.src = selectedCard.imgUrl;
                bgImgEl.style.display = 'block'; // 顯示圖片
                cardEl.style.opacity = '1';
            };
            
            imgLoader.onerror = function() {
                // 圖片載入失敗的備案：顯示純色背景和文字
                console.error('Failed to load image:', selectedCard.imgUrl);
                tagEl.innerText = selectedCard.tag;
                quoteEl.innerText = selectedCard.text;
                bgImgEl.style.display = 'none'; // 隱藏圖片
                cardEl.style.backgroundColor = '#2c3e50'; // 設定備用底色
                cardEl.style.opacity = '1';
            };

            imgLoader.src = selectedCard.imgUrl;
        }

        // 啟動程式
        initData();
        bindEvents();
        drawCard(); // 初始化抽第一張

    </script>

        <button class="cat-btn active" onclick="changeCategory('all', this)">隨機全部</button>
        <button class="cat-btn" onclick="changeCategory('sky', this)">☁️ 天空</button>
        <button class="cat-btn" onclick="changeCategory('ocean', this)">🌊 海</button>

    <!-- 卡片本體：加入 onclick 事件 -->
    <div class="card" id="cardElement" onclick="drawCard()">

        <div class="card-overlay"></div>

        <div class="card-content">

            <div class="card-footer">點擊卡片換下一張</div>

            { category: 'ocean', tag: '🌊 海 · 隨緣', text: '請給予現在的自己，一個大大的擁抱。', img: '111/2002.jpg' },
            { category: 'ocean', tag: '🌊 海 · 隨緣', text: '你不需要完美，請放過自己。', img: '111/2003.jpg' },
            { category: 'ocean', tag: '🌊 海 · 隨緣', text: '允許自己破碎，再溫柔地把它拼湊起來。', img: '111/2004.jpg' },

            { category: 'forest', tag: '🌲 森林 · 成長', text: '當你懂得愛自己，自然會懂得如何愛世界。', img: '111/3007.jpg' },
            { category: 'forest', tag: '🌲 森林 · 成長', text: '想成為庇蔭他人的大樹，請先讓自己茁壯。', img: '111/3008.jpg' },
            { category: 'forest', tag: '🌲 森林 · 成長', text: '別懷疑，你值得擁有一切美好的事物。', img: '111/3009.jpg' },

        ];

        var currentCategory = 'all';

        function changeCategory(cat, btnElement) {
            currentCategory = cat;
            var buttons = document.querySelectorAll('.cat-btn');
            for (var i = 0; i < buttons.length; i++) {
                buttons[i].classList.remove('active');
            }
            btnElement.classList.add('active');
            drawCard();
        }

        function drawCard() {
            var filtered = [];
            for (var i = 0; i < cardsData.length; i++) {
                if (currentCategory === 'all' || cardsData[i].category === currentCategory) {
                    filtered.push(cardsData[i]);
                }
            }

            if (filtered.length === 0) return;

            var randomIndex = Math.floor(Math.random() * filtered.length);
            var card = filtered[randomIndex];

            var cardEl = document.getElementById('cardElement');
            var bgEl = document.getElementById('cardBg');
            var quoteEl = document.getElementById('cardText');
            var tagEl = document.getElementById('cardCategory');

            // 切換視覺效果
            cardEl.style.opacity = '0.4';

            setTimeout(function() {
                tagEl.innerHTML = card.tag;
                quoteEl.innerHTML = card.text;
                bgEl.style.backgroundImage = "url('" + card.img + "')";
                cardEl.style.opacity = '1';
            }, 120);
        }
    </script>
</body>

<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日大自然療癒卡</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #f4f6f5;
            color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 1.4rem;
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 6px;
        }
        p.subtitle {
            font-size: 0.85rem;
            color: #7f8c8d;
        }
        
        /* 分類選擇 */
        .category-container {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .cat-btn {
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            background-color: #e2e8e4;
            color: #555;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .cat-btn.active {
            background-color: #4a7c59;
            color: white;
            box-shadow: 0 2px 8px rgba(74, 124, 89, 0.3);
        }

        /* 療癒卡片容器 */
        .card {
            width: 310px;
            height: 440px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px 25px;
            text-align: center;
            margin-bottom: 25px;
            cursor: pointer;
            background-color: #1a252f; /* 預設底色 */
            transition: opacity 0.2s ease, transform 0.15s ease;
        }
        .card:active {
            transform: scale(0.98);
        }

        /* 背景圖片 - 改回CSS背景圖，但在JS中使用相對路徑 */
        .card-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            z-index: 0;
            opacity: 0; /* 初始隱藏，讀取完才顯示 */
            transition: opacity 0.3s ease;
        }

        /* 柔和遮罩 */
        .card-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1;
        }
        
        .card-content {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-tag {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 1px;
            background: rgba(255, 255, 255, 0.25);
            padding: 4px 14px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
            align-self: center;
        }
        .card-quote {
            font-size: 1.25rem;
            line-height: 1.7;
            font-weight: 400;
            color: #ffffff;
            text-shadow: 0 2px 6px rgba(0,0,0,0.7);
            margin: auto 0;
        }
        .card-footer {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.75);
            letter-spacing: 1px;
        }

        .draw-btn {
            background-color: #4a7c59;
            color: white;
            border: none;
            padding: 14px 36px;
            border-radius: 30px;
            font-size: 1rem;

> Bi:
cursor: pointer;
            box-shadow: 0 4px 12px rgba(74, 124, 89, 0.3);
        }
    </style>
</head>
<body>

    <header>
        <h1>每日大自然療癒卡</h1>
        <p class="subtitle">點擊卡片或下方按鈕抽牌</p>
    </header>

    <div class="category-container" id="categoryContainer">
        <button class="cat-btn active" data-cat="all">隨機全部</button>
        <button class="cat-btn" data-cat="sky">☁️ 天空</button>
        <button class="cat-btn" data-cat="ocean">🌊 海</button>
        <button class="cat-btn" data-cat="forest">🌲 森林</button>
    </div>

    <!-- 卡片本體 -->
    <div class="card" id="cardElement">
        <!-- 核心修正：改回CSS背景圖層 -->
        <div id="cardBg" class="card-bg"></div>
        <div class="card-overlay"></div>

        <div class="card-content">
            <div class="card-tag" id="cardCategory"></div>
            <div class="card-quote" id="cardText">正在載入療癒句子...</div>
            <div class="card-footer">點擊卡片換下一張</div>
        </div>
    </div>

    <button class="draw-btn" id="drawBtn">換一張卡片</button>

    <script>
        // 核心修正：資料庫使用最穩健的相對路徑 '111/檔名'
        const cardsData = [
            // ☁️ 天空 (10 句)
            { category: 'sky', tag: '☁️ 天空 · 轉念', text: '明天的難題，明天自然會有答案。', img: '111/1001.jpg' },
            { category: 'sky', tag: '☁️ 天空 · 轉念', text: '失去，只是因為它從不屬於你。', img: '111/1002.jpg' },
            { category: 'sky', tag: '☁️ 天空 · 轉念', text: '錯過，是為了讓更好的來到你身邊。', img: '111/1003.jpg' },
            { category: 'sky', tag: '☁️ 天空 · 轉念', text: '當你開始相信，整個世界都會跟著轉變。', img: '111/1004.jpg' },
            { category: 'sky', tag: '☁️ 天空 · 轉念', text: '人生是一場課題，學會了，就不必再重複。', img: '111/1005.jpg' },
            { category: 'sky', tag: '☁️ 天空 · 轉念', text: '這場經歷，只是為了讓你學會一件事。', img: '111/1006.jpg' },
            { category: 'sky', tag: '☁️ 天空 · 轉念', text: '活著，或許只是為了到這個星球散散步。', img: '111/1007.jpg' },
            { category: 'sky', tag: '☁️ 天空 · 轉念', text: '會有轉機的，請對宇宙抱持絕對的信任。', img: '111/1008.jpg' },
            { category: 'sky', tag: '☁️ 天空 · 轉念', text: '困住你的從來不是現狀，而是你的執念。', img: '111/1009.jpg' },
            { category: 'sky', tag: '☁️ 天空 · 轉念', text: '結果未必是最完美的，但一定是適合你的。', img: '111/1010.jpg' },

            // 🌊 海 (10 句)
            { category: 'ocean', tag: '🌊 海 · 隨緣', text: '累了的時候，就先隨波漂流一下吧。', img: '111/2001.jpg' },
            { category: 'ocean', tag: '🌊 海 · 隨緣', text: '請給予現在的自己，一個大大的擁抱。', img: '111/2002.jpg' },
            { category: 'ocean', tag: '🌊 海 · 隨緣', text: '你不需要完美，請放過自己。', img: '111/2003.jpg' },
            { category: 'ocean', tag: '🌊 海 · 隨緣', text: '允許自己破碎，再溫柔地把它拼湊起來。', img: '111/2004.jpg' },
            { category: 'ocean', tag: '🌊 海 · 隨緣', text: '讓該走的流走，回到它原本的位置。', img: '111/2005.jpg' },
            { category: 'ocean', tag: '🌊 海 · 隨緣', text: '別把自己想得太重，也不必背負所有人的情緒。', img: '111/2006.jpg' },
            { category: 'ocean', tag: '🌊 海 · 隨緣', text: '難過時，哭出來也沒關係，笑一笑繼續走。', img: '111/2007.jpg' },
            { category: 'ocean', tag: '🌊 海 · 隨緣', text: '清空內部的陳舊，才有空間讓美好的事物進入。', img: '111/2008.jpg' },
            { category: 'ocean', tag: '🌊 海 · 隨緣', text: '愛的分享是一種流動，讓美好自然傳遞。', img: '111/2009.jpg' },
            { category: 'ocean', tag: '🌊 海 · 隨緣', text: '你已經做得很好，給自己一點掌聲吧。', img: '111/2010.jpg' },

            // 🌲 森林 (10 句)
            { category: 'forest', tag: '🌲 森林 · 成長', text: '請你讓自己活成，怦然心動的模樣。', img: '111/3001.jpg' },
            { category: 'forest', tag: '🌲 森林 · 成長', text: '答案就在你的心中，靜下來問問自己。', img: '111/3002.jpg' },
            { category: 'forest', tag: '🌲 森林 · 成長', text: '先完成，再追求完美。', img: '111/3003.jpg' },
            { category: 'forest', tag: '🌲 森林 · 成長', text: '世界狀態或許複雜，但你可以選擇保持善良。', img: '111/3004.jpg' },
            { category: 'forest', tag: '🌲 森林 · 成長', text: '去吧！勇敢為自己試一次。', img: '111/3005.jpg' },
            { category: 'forest', tag: '🌲 森林 · 成長', text: '你是太陽花，為什麼非要長成玫瑰？', img: '111/3006.jpg' },
            { category: 'forest', tag: '🌲 森林 · 成長', text: '當你懂得愛自己，自然會懂得如何愛世界。', img: '111/3007.jpg' },
            { category: 'forest', tag: '🌲 森林 · 成長', text: '想成為庇蔭他人的大樹，請先讓自己茁壯。', img: '111/3008.jpg' },

> Bi:
{ category: 'forest', tag: '🌲 森林 · 成長', text: '別懷疑，你值得擁有一切美好的事物。', img: '111/3009.jpg' },
            { category: 'forest', tag: '🌲 森林 · 成長', text: '燦爛地為自己燃燒一次吧！', img: '111/3010.jpg' }
        ];

        let currentCategory = 'all';

        // 啟動程式：綁定事件並抽第一張卡
        function initApp() {
            // 綁定卡片點擊
            document.getElementById('cardElement').addEventListener('click', drawCard);
            // 綁定按鈕點擊
            document.getElementById('drawBtn').addEventListener('click', drawCard);
            
            // 綁定分類點擊 (使用事件代理)
            document.getElementById('categoryContainer').addEventListener('click', function(e) {
                if (e.target.classList.contains('cat-btn')) {
                    // 切換按鈕樣式
                    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    // 更新篩選類別並抽卡
                    currentCategory = e.target.getAttribute('data-cat');
                    drawCard();
                }
            });

            // 初始化抽第一張卡
            drawCard();
        }

        function drawCard() {
            // 篩選卡片
            let filteredCards = cardsData;
            if (currentCategory !== 'all') {
                filteredCards = cardsData.filter(c => c.category === currentCategory);
            }
            
            if (filteredCards.length === 0) return;

            // 隨機選擇
            const randomIndex = Math.floor(Math.random() * filteredCards.length);
            const selectedCard = filteredCards[randomIndex];

            const cardEl = document.getElementById('cardElement');
            const bgEl = document.getElementById('cardBg');
            const quoteEl = document.getElementById('cardText');
            const tagEl = document.getElementById('cardCategory');

            // 核心修正：不再使用複雜的 JavaScript 圖片預載入邏輯
            // 直接更新內容，並開啟淡入效果
            cardEl.style.opacity = '0.5'; // 輕微變暗表示更換中
            bgEl.style.opacity = '0'; // 隱藏舊背景

            // 延時一小會兒更新內容，營造流暢感
            setTimeout(() => {
                // 更新文字
                tagEl.innerText = selectedCard.tag;
                quoteEl.innerText = selectedCard.text;
                
                // 核心修正：直接設定 CSS背景圖相對路徑，讓瀏覽器自己處理路徑解析
                bgEl.style.backgroundImage = url('${selectedCard.img}');
                
                // 顯示新內容
                cardEl.style.opacity = '1';
                bgEl.style.opacity = '1';
            }, 100);
        }

        // 確保 DOM 載入後再啟動
        window.addEventListener('DOMContentLoaded', initApp);

    </script>
</body>
</html>
